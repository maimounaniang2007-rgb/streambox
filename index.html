<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <!-- STEP 1 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StreamBox</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <!-- HEADER -->
    <header>

        <h1>StreamBox</h1>

        <nav id="nav">

            <!-- MOBILE BUTTON -->
            <button class="hamburger" onclick="toggleMenu()">
                ☰
            </button>

            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Shows</a></li>
                <li><a href="#">About</a></li>
            </ul>

        </nav>

    </header>

    <!-- HERO -->
    <section id="hero">

        <h2>Stream what you love</h2>

        <p>Anytime, anywhere</p>

        <button>Browse</button>

    </section>

    <!-- DRAMA -->
    <section class="movie-section">

        <h2>Drama</h2>

        <div class="category">

            <article class="card">
                <div class="image-box"></div>
                <h3>Show 1</h3>
                <p>Drama</p>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <h3>Show 2</h3>
                <p>Drama</p>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <h3>Show 3</h3>
                <p>Drama</p>
            </article>

        </div>

    </section>

    <!-- COMEDY -->
    <section class="movie-section">

        <h2>Comedy</h2>

        <div class="category">

            <article class="card">
                <div class="image-box"></div>
                <h3>Comedy 1</h3>
                <p>Comedy</p>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <h3>Comedy 2</h3>
                <p>Comedy</p>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <h3>Comedy 3</h3>
                <p>Comedy</p>
            </article>

        </div>

    </section>

    <!-- THRILLER -->
    <section class="movie-section">

        <h2>Thriller</h2>

        <div class="category">

            <article class="card">
                <div class="image-box"></div>
                <h3>Thriller 1</h3>
                <p>Thriller</p>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <h3>Thriller 2</h3>
                <p>Thriller</p>
            </article>

            <article class="card">
                <div class="image-box"></div>
                <h3>Thriller 3</h3>
                <p>Thriller</p>
            </article>

        </div>

    </section>

    <script>

        function toggleMenu() {
            document.getElementById("nav").classList.toggle("open");
        }

    </script>

</body>
</html>
