<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamBox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>StreamBox</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Shows</a>
            <a href="#">About</a>
        </nav>
    </header>

    <!-- HERO -->
    <section id="hero">
        <h2>Stream what you love</h2>
        <p>Anytime, anywhere</p>
        <button>Browse</button>
    </section>

    <!-- DRAMA -->
    <section class="movie-section">
        <h2>Drama</h2>

        <nav class="category-nav">

            <article class="card">
                <h3>Show 1</h3>
                <p>Drama</p>
            </article>

            <article class="card">
                <h3>Show 2</h3>
                <p>Drama</p>
            </article>

            <article class="card">
                <h3>Show 3</h3>
                <p>Drama</p>
            </article>

        </nav>
    </section>

    <!-- COMEDY -->
    <section class="movie-section">
        <h2>Comedy</h2>

        <nav class="category-nav">

            <article class="card">
                <h3>Comedy 1</h3>
                <p>Comedy</p>
            </article>

            <article class="card">
                <h3>Comedy 2</h3>
                <p>Comedy</p>
            </article>

            <article class="card">
                <h3>Comedy 3</h3>
                <p>Comedy</p>
            </article>

        </nav>
    </section>

    <!-- THRILLER -->
    <section class="movie-section">
        <h2>Thriller</h2>

        <nav class="category-nav">

            <article class="card">
                <h3>Thriller 1</h3>
                <p>Thriller</p>
            </article>

            <article class="card">
                <h3>Thriller 2</h3>
                <p>Thriller</p>
            </article>

            <article class="card">
                <h3>Thriller 3</h3>
                <p>Thriller</p>
            </article>

        </nav>
    </section>

</body>
</html>
